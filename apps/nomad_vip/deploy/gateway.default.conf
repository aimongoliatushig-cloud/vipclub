server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 308 https://srv1871758.hstgr.cloud$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name srv1871758.hstgr.cloud;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/srv1871758.hstgr.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/srv1871758.hstgr.cloud/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /vip-entry {
    return 308 /vip-entry/;
  }

  location ^~ /vip-entry/ {
    proxy_pass http://vip-entry-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /vip-entry;
    proxy_read_timeout 120s;
  }

  location ^~ /vip-entry-api/ {
    rewrite ^/vip-entry-api/(.*)$ /api/$1 break;
    proxy_pass http://nomad-frontend-1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /staff {
    return 308 /staff/;
  }

  location ^~ /staff/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    proxy_pass http://nomad-entertainer-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /staff;
    proxy_read_timeout 120s;
  }

  location ^~ /staff-api/ {
    rewrite ^/staff-api/(.*)$ /api/$1 break;
    proxy_pass http://nomad-frontend-1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /manager {
    return 308 /manager/;
  }

  location ^~ /manager/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    proxy_pass http://nomad-manager-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /manager;
    proxy_read_timeout 120s;
  }

  location /socket.io {
    proxy_pass http://nomad-websocket-1:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Frappe realtime authenticates the session by fetching its Origin URL.
    # Keep that callback on the internal network while exposing one fixed,
    # credentialed public origin to the browser.
    proxy_set_header Host nomad-frontend-1:8080;
    proxy_set_header Origin http://nomad-frontend-1:8080;
    proxy_set_header X-Frappe-Site-Name nomad.local;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin "https://srv1871758.hstgr.cloud" always;
    add_header Access-Control-Allow-Credentials "true" always;
    proxy_read_timeout 120s;
  }

  # The former public customer-registration SPA is intentionally retired.
  # ERPNext/Frappe owns the root, /login, /app, /desk, /api, /assets and /files.
  location / {
    proxy_pass http://nomad-frontend-1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 120s;
  }
}
