name: nomad-entertainer

services:
  web:
    image: nginx:1.27-alpine
    container_name: nomad-entertainer-web
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - frappe_docker_default

networks:
  frappe_docker_default:
    external: true
